name: Weekly GPU Pricing Health Monitor

on:
  schedule:
    # Runs every Monday at 08:00 UTC (6:00 PM AEST / 7:00 PM AEDT)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  check-gpu-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Tracker & Dispatch Alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python gpu_neocloud_monitor.py
